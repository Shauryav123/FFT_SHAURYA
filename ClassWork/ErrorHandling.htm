<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error Handling</title>
</head>
<body>
    <h1>Error Handling</h1>
    <script>
        try{
        let sum = 20+10;
        document.write(sum);
        }catch(error){
            document.write("Error solved");
        }finally{
            document.write("<br>Program executed successfully");
        }   
    </script>
</body>
</html>
