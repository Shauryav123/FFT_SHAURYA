<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Facebook</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Segoe UI", Helvetica, Arial, sans-serif;
        background: #fff;
      }
      .page {
        display: flex;
        min-height: 100vh;
      }
      .left-content {
        flex: 1.5;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 40px 60px;
      }
      .left-content h1 {
        font-size: 40px;
        font-weight: 700;
        color: #1877f2;
        margin: 0 0 16px;
        letter-spacing: -1px;
      }
      .left-content p {
        font-size: 20px;
        color: #374151;
        line-height: 1.5;
        max-width: 480px;
        margin: 0;
      }
      .divider {
        width: 1px;
        background: #e5e7eb;
      }
      .right-panel {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px 20px;
      }
      form {
        width: 100%;
        max-width: 560px;
      }
      form > h4:first-of-type {
        margin: 0 0 24px;
        font-size: 24px;
        font-weight: 600;
        color: #111827;
        letter-spacing: -0.2px;
      }
      form div {
        margin-bottom: 16px;
      }
      label {
        display: block;
        margin-bottom: 6px;
        font-size: 14px;
        color: #4b5563;
      }
      input[type="text"],
      input[type="password"] {
        width: 100%;
        padding: 0 16px;
        height: 54px;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        font-size: 15px;
        background: #fff;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }
      input[type="text"]:focus,
      input[type="password"]:focus {
        outline: none;
        border-color: #4267d5;
        box-shadow: 0 0 0 3px rgba(66, 103, 213, 0.15);
      }
      button {
        width: 100%;
        height: 54px;
        border: none;
        border-radius: 27px;
        background: #4267d5;
        color: #fff;
        cursor: pointer;
        font-size: 16px;
        font-weight: 600;
        transition: background 0.15s ease;
      }
      button:hover {
        background: #3658bd;
      }
      a {
        color: #1877f2;
        text-decoration: none;
        font-size: 15px;
        transition: color 0.15s ease;
      }
      a:hover {
        color: #145dbf;
        text-decoration: underline;
        background: none;
      }
      form div:nth-of-type(4) {
        text-align: center;
        margin: 18px 0 30px;
      }
      form div:nth-of-type(4) a {
        color: #4b5563;
      }
      form div:nth-of-type(5) {
        margin-bottom: 28px;
      }
      form div:nth-of-type(5) a {
        display: block;
        text-align: center;
        border: 1px solid #4267d5;
        color: #3157cf;
        border-radius: 27px;
        padding: 14px 10px;
        font-size: 16px;
        font-weight: 500;
        transition: background 0.15s ease;
      }
      form div:nth-of-type(5) a:hover {
        background: #f0f4ff;
        text-decoration: none;
      }
      form div:last-child {
        text-align: center;
        margin-bottom: 0;
      }
      form div:last-child h4 {
        margin: 0;
        font-size: 15px;
        color: #6b7280;
        font-weight: 500;
      }
      form div:last-child h4::before {
        content: "∞ ";
        color: #3157cf;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="left-content">
        <h1>facebook</h1>
        <p>Connect with friends and the world around you.</p>
      </div>
      <div class="divider"></div>
      <div class="right-panel">
        <form>
          <h4>Log in to Facebook</h4>
          <div>
            <label for="email">Email or Phone:</label>
            <input type="text" id="email" name="email" required />
          </div>
          <div>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required />
          </div>
          <div>
            <button type="submit">Log In</button>
          </div>
          <div>
            <a href="#">Forgotten password?</a>
          </div>
          <div>
            <a href="#">Create New Account</a>
          </div>
          <div>
            <h4>Meta</h4>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
